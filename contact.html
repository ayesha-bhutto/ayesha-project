<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mechanic Repair Request</title>
    <style>
        /* style.css */
@import url('googleapis.com');

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #0a0a0a;
    background-image: radial-gradient(circle at 10% 20%, rgba(224, 30, 55, 0.05) 0%, transparent 40%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

/* Flexbox Layout Container */
.contact-card {
    display: flex;
    width: 100%;
    max-width: 900px;
    background: #121212;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7), 0 0 15px rgba(239, 35, 60, 0.1);
    border: 1px solid #1a1a1a;
    animation: fadeIn 0.8s ease-out;
}

/* Brand Side panel */
.brand-side {
    flex: 1;
    background: #1a1a1a;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px;
    border-right: 3px solid #ef233c;
}

/* Real-time background glowing circle */
.brand-side::before {
    content: '';
    position: absolute;
    width: 150px;
    height: 150px;
    background: #ef233c;
    filter: blur(100px);
    opacity: 0.2;
}

.brand-content {
    position: relative;
    z-index: 2;
    text-align: center;
}

.gear-icon {
    font-size: 3.5rem;
    animation: spin 6s linear infinite;
    display: inline-block;
    margin-bottom: 15px;
}

.brand-content h1 {
    font-family: 'Orbitron', sans-serif;
    color: #fff;
    font-size: 1.8rem;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.brand-content p {
    color: #888;
    font-size: 0.9rem;
    margin-bottom: 25px;
    line-height: 1.5;
}

.status-badge {
    background: #000;
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 0.8rem;
    border: 1px solid #333;
    display: inline-block;
}

/* Form Side Panel */
.form-side {
    flex: 1.3;
    padding: 50px 40px;
    background: #121212;
}

.form-side h2 {
    color: #fff;
    font-size: 1.8rem;
    margin-bottom: 30px;
    font-weight: 600;
}

.form-side h2 span {
    color: #ef233c;
}

form {
    display: flex;
    flex-direction: column;
    gap: 25px;
}

/* Animated Input Styling */
.input-box {
    position: relative;
    width: 100%;
}

.input-box input,
.input-box textarea {
    width: 100%;
    padding: 10px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid #333;
    color: #fff;
    font-size: 0.95rem;
    outline: none;
    resize: none;
    transition: border-color 0.3s ease;
}

.input-box label {
    position: absolute;
    left: 0;
    top: 10px;
    color: #666;
    pointer-events: none;
    transition: all 0.3s ease;
    font-size: 0.95rem;
}

/* Decorative focus line */
.input-box .line {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 0;
    height: 2px;
    background: #ef233c;
    transition: width 0.4s ease;
}

/* Moving the label up on focus/validation */
.input-box input:focus ~ label,
.input-box input:valid ~ label,
.input-box textarea:focus ~ label,
.input-box textarea:valid ~ label {
    top: -15px;
    font-size: 0.8rem;
    color: #ef233c;
}

.input-box input:focus ~ .line,
.input-box input:valid ~ .line,
.input-box textarea:focus ~ .line,
.input-box textarea:valid ~ .line {
    width: 100%;
}

/* Button & Hover Effects */
.submit-btn {
    position: relative;
    background: #ef233c;
    color: #fff;
    border: none;
    padding: 12px 20px;
    font-size: 1rem;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    overflow: hidden;
    z-index: 1;
    transition: transform 0.2s ease, box-shadow 0.3s ease;
}

.submit-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: #bd152b;
    transition: left 0.4s ease;
    z-index: -1;
}

/* Hover transitions */
.submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(239, 35, 60, 0.4);
}

.submit-btn:hover::before {
    left: 0;
}

.submit-btn:active {
    transform: translateY(0);
}

/* Animations */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

/* Responsive adjustments */
@media (max-width: 768px) {
    .contact-card {
        flex-direction: column;
    }
    .brand-side {
        border-right: none;
        border-bottom: 3px solid #ef233c;
        padding: 30px;
    }
    .form-side {
        padding: 35px 25px;
    }
}

    </style>    
</head>
<body>
    <div class="contact-card">
        <div class="brand-side">
            <div class="overlay"></div>
            <div class="brand-content">
                <div class="gear-icon">⚙️</div>
                <h1>PRO MECHANIC</h1>
                <p>High-performance diagnostics & heavy-duty repairs.</p>
                <div class="status-badge">🟢 Shop Status: Open</div>
            </div>
        </div>
        <div class="form-side">
            <h2>Book a <span>Repair</span></h2>
            <form action="#" method="POST">
                <div class="input-box">
                    <input type="text" id="name" required>
                    <label for="name">Full Name</label>
                    <span class="line"></span>
                </div>
                <div class="input-box">
                    <input type="email" id="email" required pattern="[a-z0-9._%+-]+@gmail\.com$" title="Please enter a valid Gmail address">
                    <label>Gmail Address</label>
                    <span class="line"></span>
                </div>
                <div class="input-box">
                    <input type="text" id="address" required>
                    <label for="address">Vehicle Location / Home Address</label>
                    <span class="line"></span>
                </div>
                <div class="input-box">
                    <textarea id="message" rows="4" required></textarea>
                    <label for="message">Detailed Repair Message</label>
                    <span class="line"></span>
                </div>
                <button type="submit" class="submit-btn">
                    <span>Submit Request</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>

</body>
</html>
